[project]
name = "fin"
version = "0.1.0"
description = "Personal quant research infrastructure: data, signals, backtesting, execution."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=15",
    "yfinance>=0.2.50",
    "typer>=0.12",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "arch>=7.0",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "cvxpy>=1.5",
    "fastapi>=0.115",
    "uvicorn>=0.30",
]

[project.scripts]
fin = "fin.cli:app"

[dependency-groups]
dev = [
    "httpx>=0.27",
    "pytest>=8",
    "ruff>=0.6",
]
research = [
    "jupyterlab>=4",
    "ipykernel>=6",
    "jupytext>=1.16",
    "nbconvert>=7",
]

[tool.uv]
default-groups = ["dev", "research"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fin"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Notebooks are linted through their jupytext .py pair.
extend-exclude = ["*.ipynb"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
# Notebooks: a bare expression at the end of a cell is how results are displayed.
"research/*.py" = ["B018", "E501"]
